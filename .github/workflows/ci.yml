name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Next.js route types
        run: npx --no-install next typegen
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Enforce dependency audit policy
        run: npm run audit:ci
      - name: Retain audit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-audit-reports
          path: audit-results/*.json
          if-no-files-found: error
          retention-days: 14

  disposable-database:
    name: Fresh and upgrade database verification
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Verify disposable fresh and upgrade databases
        id: database
        run: |
          npm run test
          DISPOSABLE_DB_ACK=yes npm run test:stabilization-db
      - name: Record sanitized CI outcome
        if: ${{ always() }}
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
          VERIFICATION_OUTCOME: ${{ steps.database.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          const directory = `artifacts/stabilization-db/${process.env.TESTED_SHA}`;
          mkdirSync(directory, { recursive: true });
          writeFileSync(`${directory}/ci.json`, JSON.stringify({
            gitSha: process.env.TESTED_SHA,
            verificationOutcome: process.env.VERIFICATION_OUTCOME,
            workflowRun: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
          }, null, 2) + '\n');
          NODE
      - name: Retain sanitized database evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stabilization-db-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: artifacts/stabilization-db/**/*.json
          if-no-files-found: error
          retention-days: 14
